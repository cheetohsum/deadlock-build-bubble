<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build Bubble Manager</title>
<style>
  :root {
    --bg: #0f0e0c; --panel: #1b1916; --panel2: #221f1a; --line: #cbbca626; --line2: #cbbca655;
    --cream: #cbbca6; --text: #e9e3d8; --muted: #969087; --teal: #96dbd0; --amber: #ff9d3c; --red: #ff6666; --green: #7bbf45;
    --display: "Bahnschrift SemiCondensed", "Arial Narrow", sans-serif;
    --ui: "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  /* Slim themed scrollbars everywhere in the manager (sidebar, hero list, log). */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cbbca633; border-radius: 4px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: #96dbd088; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-corner { background: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 var(--ui); }
  button, select, input { font: inherit; color: inherit; }
  .app { display: grid; grid-template-columns: 380px 1fr; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; }
  main { display: grid; grid-template-rows: auto 1fr auto; min-width: 0; }

  header.brand { padding: 20px 22px 16px; border-bottom: 1px solid var(--line); background: linear-gradient(90deg, #583f2155, transparent); }
  .brand h1 { margin: 0; font: 600 26px var(--display); letter-spacing: 2px; color: var(--cream); text-transform: uppercase; }
  .brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 22px; border-bottom: 1px solid var(--line); }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; background: #ffffff0d; font-size: 12px; color: var(--muted); }
  .chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .chip.ok::before { background: var(--green); }
  .chip.warn::before { background: var(--amber); }
  .chip.bad::before { background: var(--red); }

  section.group { padding: 16px 22px; border-bottom: 1px solid var(--line); }
  section.group h2 { margin: 0 0 12px; font: 600 13px var(--display); letter-spacing: 2px; text-transform: uppercase; color: var(--cream); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 10px 0; }
  .row label { color: var(--text); }
  .row small { display: block; color: var(--muted); font-size: 12px; }
  .hint { color: var(--muted); font-size: 12px; margin: 4px 0 0; }

  .seg { display: inline-flex; background: #ffffff0a; border: 1px solid var(--line); border-radius: 6px; padding: 2px; }
  .seg button { border: 0; background: none; padding: 5px 11px; border-radius: 4px; cursor: pointer; color: var(--muted); font: 600 13px var(--display); letter-spacing: 1px; text-transform: uppercase; }
  .seg button.on { background: #96dbd026; color: #fff; box-shadow: inset 0 -2px 0 var(--teal); }

  .switch { position: relative; width: 40px; height: 22px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; border-radius: 11px; background: #ffffff1a; transition: .15s; cursor: pointer; }
  .switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--cream); transition: .15s; }
  .switch input:checked + span { background: #96dbd066; }
  .switch input:checked + span::after { transform: translateX(18px); background: #fff; }
  .switch input:focus-visible + span { outline: 2px solid var(--teal); outline-offset: 2px; }

  select, input[type=number], input[type=text], input[type=password] { background: #0f0e0c; border: 1px solid var(--line2); border-radius: 5px; padding: 5px 8px; min-width: 0; }
  input[type=range] { accent-color: var(--teal); width: 100%; }
  .row input.num { width: 72px; text-align: right; }
  .rankRow { display: flex; align-items: center; gap: 10px; margin: 8px 0 4px; min-height: 36px; }
  .rankRow img { width: 34px; height: 34px; object-fit: contain; flex: none; }
  .rankRow b { display: block; font: 600 15px var(--display); letter-spacing: 1px; color: var(--text); }
  .rankRow span { display: block; color: var(--muted); font-size: 12px; }

  /* Hero picker: portrait + the hero's stylised name logo, tinted with their theme colour. */
  .heroSelect { position: relative; }
  .hsButton {
    display: flex; align-items: center; gap: 10px; width: 100%; min-width: 220px; padding: 5px 34px 5px 6px;
    background: #0f0e0c; border: 1px solid var(--line2); border-radius: 6px; cursor: pointer; text-align: left; position: relative;
  }
  .hsButton::after { content: ""; position: absolute; right: 12px; top: 50%; width: 7px; height: 7px; border-right: 2px solid var(--cream); border-bottom: 2px solid var(--cream); transform: translateY(-70%) rotate(45deg); }
  .hsButton:hover, .hsButton[aria-expanded="true"] { border-color: var(--teal); }
  .hsButton:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  .hsPortrait { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #141414; border: 1px solid var(--line2); flex: none; }
  .hsNone { display: grid; place-items: center; color: var(--muted); font-weight: 600; }
  .hsName {
    display: block; height: 18px; max-width: 150px; background: var(--c, var(--cream));
    -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-position: left center; mask-position: left center;
  }
  .hsText { font: 600 15px var(--display); letter-spacing: 1px; text-transform: uppercase; color: var(--c, var(--text)); }
  .hsPanel {
    position: absolute; z-index: 20; top: calc(100% + 6px); left: 0; width: 560px; max-width: 90vw;
    background: var(--panel2); border: 1px solid var(--line2); border-radius: 10px; box-shadow: 0 14px 40px #000c; padding: 10px;
  }
  .hsPanel.right { left: auto; right: 0; }
  .hsFilter { width: 100%; margin-bottom: 8px; }
  .hsList { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; max-height: 360px; overflow-y: auto; }
  .hsOption { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
  .hsOption:hover, .hsOption.focus { background: #ffffff10; }
  .hsOption[aria-selected="true"] { border-color: var(--teal); background: #96dbd01a; }
  .hsOption .hsPortrait { width: 36px; height: 36px; }

  .pins { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .pin { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 5px; background: #ffffff08; font-size: 13px; }
  .pin .hsPortrait { width: 26px; height: 26px; }
  .pin b { flex: 1; font-weight: 600; }
  .pin code { color: var(--teal); }
  .pin button { border: 0; background: none; color: var(--muted); cursor: pointer; }
  .pin button:hover { color: var(--red); }
  .pinForm { display: grid; grid-template-columns: 1fr 88px auto; gap: 6px; margin-top: 8px; align-items: center; }
  .pinForm .hsButton { min-width: 0; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 16px 22px 22px; }
  .btn { border: 1px solid var(--line2); background: #ffffff0a; border-radius: 6px; padding: 9px 10px; cursor: pointer; font: 600 14px var(--display); letter-spacing: 1px; text-transform: uppercase; color: var(--cream); }
  .btn:hover { background: #ffffff16; }
  .btn.primary { background: #96dbd026; border-color: var(--teal); color: #fff; }
  .btn.danger:hover { border-color: var(--red); color: var(--red); }
  .btn:disabled { opacity: .45; cursor: progress; }

  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .toolbar .title { font: 600 13px var(--display); letter-spacing: 2px; color: var(--cream); text-transform: uppercase; margin-right: auto; }
  .stage { position: relative; min-height: 0; padding: 18px; }
  .stage iframe { width: 100%; height: 100%; border: 1px solid var(--line); border-radius: 8px; background: #000; }
  .kbd { display: inline-block; padding: 1px 7px; border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 4px; font: 12px Consolas, monospace; color: var(--cream); }

  .log { margin: 0 18px 18px; max-height: 190px; overflow: auto; padding: 10px 12px; border-radius: 8px; background: #0a0908; border: 1px solid var(--line); font: 12px/1.5 Consolas, monospace; color: #bdb5a8; white-space: pre-wrap; }
  .log:empty::before { content: "Tool output and bubble log messages appear here."; color: #5f5a52; }
  .log .ok { color: var(--green); } .log .err { color: var(--red); }

  /* One control height for the preview toolbar and the pin form: hero pickers, segmented buttons,
     the build id field and the Pin button all line up. */
  :root { --ctl-h: 44px; }
  .hsButton { height: var(--ctl-h); padding-top: 0; padding-bottom: 0; }
  .toolbar .seg { height: var(--ctl-h); align-items: stretch; }
  .toolbar .seg button { display: flex; align-items: center; padding: 0 14px; }
  .pinForm input, .pinForm .btn { height: var(--ctl-h); }
  .pinForm .btn { padding-top: 0; padding-bottom: 0; }

  /* Hero list scrollbar: inset, rounded track that stops short of the corners, cream thumb, teal on hover
     (same look as the bubble's in-game scrollbar). */
  .hsList { padding-right: 8px; }
  .hsList::-webkit-scrollbar { width: 6px; }
  .hsList::-webkit-scrollbar-track { background: #ffffff08; border-radius: 3px; margin: 6px 0; }
  .hsList::-webkit-scrollbar-thumb { background: #cbbca655; border: 0; border-radius: 3px; background-clip: border-box; }
  .hsList::-webkit-scrollbar-thumb:hover { background: #96dbd0aa; border: 0; }
  .hsList::-webkit-scrollbar-thumb:active { background: #96dbd0; }

  /* Info icon with a hover / focus bubble explaining a setting. */
  .info {
    position: relative; display: inline-grid; place-items: center; width: 17px; height: 17px; margin-left: 6px;
    border-radius: 50%; border: 1px solid var(--line2); color: var(--cream); font: 700 11px Georgia, serif; font-style: italic;
    cursor: help; vertical-align: 1px;
  }
  .info:hover, .info:focus-visible { border-color: var(--teal); color: #fff; outline: none; }
  .infoTip {
    position: absolute; z-index: 30; left: -30px; bottom: calc(100% + 8px); width: 270px; padding: 10px 12px;
    border-radius: 6px; background: #0b0a09; border: 1px solid #e9e3d8; color: #fff; box-shadow: 0 10px 28px #000;
    font: 500 12.5px/1.5 var(--ui); font-style: normal; text-align: left; text-transform: none; letter-spacing: 0;
    opacity: 0; pointer-events: none; transition: opacity .12s;
  }
  .info:hover .infoTip, .info:focus .infoTip { opacity: 1; }

  /* Toolbar labels use the sidebar section-header style. */
  .toolLabel { display: inline-flex; align-items: center; gap: 8px; font: 600 13px var(--display); letter-spacing: 2px; text-transform: uppercase; color: var(--cream); }
  .toolLabel .kbd { letter-spacing: 0; text-transform: none; }
</style>
</head>
<body>
<div class="app">
  <aside>
    <header class="brand">
      <h1>Build Bubble</h1>
    </header>
    <div class="chips" id="chips"></div>

    <section class="group">
      <h2>Details</h2>
      <div class="row"><label>Default tab</label></div>
      <div class="seg" id="source">
        <button data-v="standard">Community</button><button data-v="pro">Pro</button><button data-v="winrate">Top WR</button>
      </div>
      <div class="row"><label for="autoShowShop">Open with the shop</label><label class="switch"><input type="checkbox" id="autoShowShop"><span></span></label></div>
      <div class="row"><label for="autoShowDraft">Open in the Street Brawl draft</label><label class="switch"><input type="checkbox" id="autoShowDraft"><span></span></label></div>
      <div class="row"><label for="hotkey">Hotkey</label>
        <select id="hotkey">
          <option value="key_backslash">\ (backslash)</option><option value="key_backquote">` (backquote)</option>
          <option value="key_f6">F6</option><option value="key_f8">F8</option><option value="key_insert">Insert</option>
        </select>
      </div>
    </section>

    <section class="group">
      <h2>Display</h2>
      <div class="row"><label>Screen side</label><div class="seg" id="position"><button data-v="left">Left</button><button data-v="right">Right</button></div></div>
      <div class="row"><label for="compact">Compact</label><label class="switch"><input type="checkbox" id="compact"><span></span></label></div>
      <div class="row"><label for="animations">Animations</label><label class="switch"><input type="checkbox" id="animations"><span></span></label></div>
    </section>

    <section class="group">
      <h2>Data</h2>
      <label for="minBadgeWinrate">Win-rate rank floor</label>
      <div class="rankRow" id="minBadgeWinrateVal"></div>
      <input type="range" id="minBadgeWinrate">
      <label for="proBadge" style="display:block;margin-top:16px">Pro rank floor</label>
      <div class="rankRow" id="proBadgeVal"></div>
      <input type="range" id="proBadge">

      <div class="row" style="margin-top:18px"><label for="maxBuilds">Builds to load
        <span class="info" tabindex="0" role="img" aria-label="About builds to load">i<span class="infoTip">The most builds listed for each hero on the COMMUNITY and PRO tabs (the build menu shows six to a page). PRO can list fewer when not enough leaderboard players have published builds. More builds make Refresh data slower and the mod a bit bigger. Takes effect after Refresh data, then Install.</span></span></label>
        <input type="number" id="maxBuilds" class="num" min="1" max="60" step="1"></div>
      <div class="row"><label for="maxProMatches">Pro matches to load
        <span class="info" tabindex="0" role="img" aria-label="About pro matches to load">i<span class="infoTip">The most recent matches by top leaderboard players listed for each hero on the PRO tab (five to a page), from the last three weeks. Heroes with fewer recent pro games list fewer. Takes effect after Refresh data, then Install.</span></span></label>
        <input type="number" id="maxProMatches" class="num" min="1" max="45" step="1"></div>

      <div class="row" style="margin-top:18px"><label>Pinned builds
        <span class="info" tabindex="0" role="img" aria-label="About pinned builds">i<span class="infoTip">Choose a hero and enter a build's ID number (the hero_build_id shown for builds on deadlock-api.com). That build becomes the first COMMUNITY build for the hero, marked PINNED. It takes effect after Refresh data, then Install.</span></span></label></div>
      <div class="pins" id="pins"></div>
      <div class="pinForm">
        <div class="heroSelect" id="pinHero"></div>
        <input type="number" id="pinId" placeholder="Build id" min="1" aria-label="Build id">
        <button class="btn" id="pinAdd">Pin</button>
      </div>

      <div class="row" style="margin-top:18px"><label for="apiKey">API key
        <span class="info" tabindex="0" role="img" aria-label="About the API key">i<span class="infoTip">Optional. A deadlock-api.com key (a perk for sponsors of the project) raises its rate limit, so Refresh data finishes faster. It is only sent to api.deadlock-api.com, as the X-API-KEY header. Leave it empty to use the free limit.</span></span></label></div>
      <input type="password" id="apiKey" placeholder="X-API-KEY" autocomplete="off" style="width:100%">
    </section>

    <div class="actions">
      <button class="btn" data-run="gen">Refresh data</button>
      <button class="btn" data-run="build">Build</button>
      <button class="btn primary" data-run="install">Install</button>
      <button class="btn danger" data-run="uninstall">Uninstall</button>
    </div>
  </aside>

  <main>
    <div class="toolbar">
      <span class="title">Live preview</span>
      <div class="heroSelect" id="pvHero"></div>
      <div class="seg" id="pvMode"><button data-v="shop">Shop</button><button data-v="draft">Street Brawl</button><button data-v="hotkey">Hotkey</button></div>
      <span class="toolLabel">Toggle <span class="kbd" id="pvKey">\</span></span>
    </div>
    <div class="stage"><iframe id="preview" title="Bubble preview"></iframe></div>
    <div class="log" id="log"></div>
  </main>
</div>

<script>
const $ = (s) => document.querySelector(s);
let cfg = null, heroes = [], pvMode = 'shop', pvHeroId = '', pinHeroId = '';
const KEY_LABEL = { key_backslash: '\\', key_backquote: '`', key_f6: 'F6', key_f8: 'F8', key_insert: 'Insert' };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Rank names, icons and the match distribution come from the last data refresh (/api/ranks).
let RANKS = { ranks: [], distribution: [] };
// Valid badge values: 0 = every rank, then tier * 10 + subrank (1-6) for tiers 1-11.
const BADGE_VALUES = [0];
for (let t = 1; t <= 11; t++) for (let s = 1; s <= 6; s++) BADGE_VALUES.push(t * 10 + s);
// Snap up: a floor of 80 means "average at least 80", i.e. Oracle 1 and above.
const badgeIndex = (b) => { const i = BADGE_VALUES.findIndex((v) => v >= b); return i < 0 ? BADGE_VALUES.length - 1 : i; };

// The win-rate queries keep matches whose *average* badge is at least b, so the share shown is of matches.
function rankInfo(b) {
  if (!b) return { name: 'All ranks', img: '', share: 1 };
  const tier = Math.floor(b / 10), sub = b % 10;
  const r = RANKS.ranks.find((x) => x.tier === tier);
  const total = RANKS.distribution.reduce((n, d) => n + d[1], 0);
  const above = RANKS.distribution.reduce((n, d) => n + (d[0] >= b ? d[1] : 0), 0);
  return { name: `${r ? r.name : 'Tier ' + tier}${sub ? ' ' + sub : ''}+`, img: r ? r.img : '', share: total ? above / total : null };
}
function shareText(share) {
  if (share == null) return 'refresh data to see match share';
  if (share >= 0.995) return 'every match';
  const p = share * 100;
  return `top ${p < 1 ? p.toFixed(1) : Math.round(p)}% of matches`;
}

function log(text, cls) {
  const el = $('#log');
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = text;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  return r.json();
}

function chip(text, kind) { return `<span class="chip ${kind}">${text}</span>`; }

async function refreshStatus() {
  const s = await api('/api/status');
  $('#chips').innerHTML = [
    s.gamePath ? chip('Deadlock found', 'ok') : chip('Deadlock not found', 'bad'),
    s.data ? chip(`Data ${s.data.generated} \u00b7 ${s.data.heroes} heroes`, 'ok') : chip('No data yet', 'warn'),
    s.installed ? chip('Installed', 'ok') : chip('Not installed', 'warn'),
    s.addonsLine === false ? chip('gameinfo needs addons line', 'warn') : '',
    s.busy ? chip(s.busy + '\u2026', 'warn') : '',
  ].join('');
}

// ----- hero picker -----
// Name logos range from nearly square (Rem, Pocket) to very wide (Haze, Paradox). One fixed height makes the
// narrow ones look tiny, so size for similar visual weight: narrower logos get taller, within limits.
function logoSize(aspect, base, maxH) {
  const a = aspect || 4;
  let h = Math.max(base * 0.75, Math.min(maxH, base * Math.pow(3 / a, 0.4)));
  let w = h * a;
  const maxW = base * 7;
  if (w > maxW) { w = maxW; h = w / a; }
  return { w: Math.round(w), h: Math.round(h) };
}

function heroFace(h, size) {
  if (!h) return `<span class="hsPortrait hsNone" style="width:${size}px;height:${size}px">?</span><span class="hsText">Not detected</span>`;
  const portrait = `<img class="hsPortrait" src="${esc(h.img)}" alt="" style="width:${size}px;height:${size}px">`;
  const logo = logoSize(h.aspect, size * 0.6, size * 0.95);
  const name = h.nameArt
    ? `<span class="hsName" role="img" aria-label="${esc(h.name)}" style="--c:${esc(h.color || '#cbbca6')};width:${logo.w}px;height:${logo.h}px;max-width:none;-webkit-mask-image:url('${esc(h.nameArt)}');mask-image:url('${esc(h.nameArt)}')"></span>`
    : `<span class="hsText" style="--c:${esc(h.color || '#e9e3d8')}">${esc(h.name)}</span>`;
  return portrait + name;
}

function heroSelect(root, { value, allowNone, alignRight, onChange }) {
  let current = value;
  root.innerHTML = `<button type="button" class="hsButton" aria-haspopup="listbox" aria-expanded="false"></button>
    <div class="hsPanel${alignRight ? ' right' : ''}" hidden>
      <input type="text" class="hsFilter" placeholder="Filter heroes" aria-label="Filter heroes">
      <div class="hsList" role="listbox"></div>
    </div>`;
  const btn = root.querySelector('.hsButton'), panel = root.querySelector('.hsPanel');
  const filter = root.querySelector('.hsFilter'), list = root.querySelector('.hsList');
  const options = () => (allowNone ? [null] : []).concat(heroes);
  const paintButton = () => { btn.innerHTML = heroFace(heroes.find((h) => h.id === current), 32); btn.setAttribute('aria-label', 'Hero: ' + ((heroes.find((h) => h.id === current) || {}).name || 'not detected')); };
  const paintList = () => {
    const q = filter.value.trim().toLowerCase();
    list.innerHTML = '';
    for (const h of options()) {
      if (q && !(h ? h.name.toLowerCase().includes(q) : 'not detected'.includes(q))) continue;
      const opt = document.createElement('div');
      opt.className = 'hsOption';
      opt.setAttribute('role', 'option');
      opt.setAttribute('aria-selected', String((h ? h.id : '') === current));
      opt.innerHTML = heroFace(h, 36);
      opt.onclick = () => choose(h ? h.id : '');
      list.appendChild(opt);
    }
  };
  const open = (v) => {
    panel.hidden = !v;
    btn.setAttribute('aria-expanded', String(v));
    if (v) { filter.value = ''; paintList(); filter.focus(); }
  };
  const choose = (id) => { current = id; paintButton(); open(false); btn.focus(); onChange && onChange(id); };
  btn.onclick = () => open(panel.hidden);
  filter.oninput = paintList;
  filter.onkeydown = (e) => {
    if (e.key === 'Escape') { open(false); btn.focus(); }
    if (e.key === 'Enter') { const first = list.querySelector('.hsOption'); if (first) first.click(); }
  };
  document.addEventListener('click', (e) => { if (!root.contains(e.target)) open(false); });
  paintButton();
  return { set(id) { current = id; paintButton(); }, refresh() { paintButton(); } };
}

// ----- settings -----
function bindSeg(id, key, onChange) {
  const seg = $('#' + id);
  const paint = () => seg.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.v === (key ? cfg[key] : pvMode)));
  seg.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (key) { cfg[key] = b.dataset.v; save(); } else pvMode = b.dataset.v;
    paint(); onChange && onChange();
  });
  paint();
}

let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => { cfg = (await api('/api/config', cfg)).config; reloadPreview(); }, 250);
}

function renderPins() {
  const pins = Object.entries(cfg.pinnedBuilds || {});
  $('#pins').innerHTML = pins.length ? '' : '';
  for (const [heroId, buildId] of pins) {
    const h = heroes.find((x) => x.id === heroId);
    const row = document.createElement('div');
    row.className = 'pin';
    row.innerHTML = `${h ? `<img class="hsPortrait" src="${esc(h.img)}" alt="">` : ''}<b></b><code>#${esc(buildId)}</code><button title="Remove" aria-label="Remove pin">\u2715</button>`;
    const name = row.querySelector('b');
    name.textContent = h ? h.name : 'Hero ' + heroId;
    if (h && h.color) name.style.color = h.color;
    row.querySelector('button').onclick = () => { delete cfg.pinnedBuilds[heroId]; renderPins(); save(); };
    $('#pins').appendChild(row);
  }
}

function paintRank(id) {
  const b = BADGE_VALUES[+$('#' + id).value];
  const r = rankInfo(b);
  $('#' + id + 'Val').innerHTML = `${r.img ? `<img src="${esc(r.img)}" alt="">` : ''}
    <div><b>${esc(r.name)}</b><span>${esc(shareText(r.share))}</span></div>`;
}

function reloadPreview() {
  const settings = {
    defaultSource: cfg.defaultSource, hotkey: cfg.hotkey, autoShowShop: cfg.autoShowShop,
    autoShowDraft: cfg.autoShowDraft, position: cfg.position, compact: cfg.compact, animations: cfg.animations !== false,
  };
  const h = heroes.find((x) => x.id === pvHeroId);
  const q = new URLSearchParams({ hero: h ? h.cls : '', mode: pvMode, settings: JSON.stringify(settings) });
  $('#preview').src = 'preview.html?' + q;
  $('#pvKey').textContent = KEY_LABEL[cfg.hotkey] || cfg.hotkey;
}

async function init() {
  if (location.protocol === 'file:') {
    document.body.innerHTML = `<div style="max-width:560px;margin:12vh auto;padding:28px;border:1px solid var(--line2);border-radius:10px;background:var(--panel)">
      <h1 style="margin:0 0 8px;font:600 24px var(--display);letter-spacing:2px;color:var(--cream);text-transform:uppercase">Open the manager through its server</h1>
      <p style="color:var(--muted)">This page was opened as a file, so it can't reach your settings, data or the build buttons.</p>
      <p>In a terminal run <code style="color:var(--teal)">npm run gui</code> in the project folder, then open
      <a style="color:var(--teal)" href="http://localhost:5178/">http://localhost:5178/</a>.</p></div>`;
    return;
  }
  cfg = (await api('/api/config')).config;
  heroes = await api('/api/heroes');
  RANKS = await api('/api/ranks');

  for (const id of ['autoShowShop', 'autoShowDraft', 'compact', 'animations']) {
    $('#' + id).checked = id === 'animations' ? cfg[id] !== false : !!cfg[id];
    $('#' + id).onchange = (e) => { cfg[id] = e.target.checked; save(); };
  }
  $('#apiKey').value = cfg.apiKey || '';
  $('#apiKey').onchange = (e) => { cfg.apiKey = e.target.value.trim(); save(); };
  $('#hotkey').value = cfg.hotkey;
  $('#hotkey').onchange = (e) => { cfg.hotkey = e.target.value; save(); };

  // Rank sliders move through real ranks (index into BADGE_VALUES), not raw badge numbers.
  for (const id of ['minBadgeWinrate', 'proBadge']) {
    const input = $('#' + id);
    Object.assign(input, { min: 0, max: BADGE_VALUES.length - 1, step: 1 });
    input.value = badgeIndex(cfg[id]);
    paintRank(id);
    input.oninput = () => paintRank(id);
    input.onchange = () => { cfg[id] = BADGE_VALUES[+input.value]; save(); };
  }
  // How much the data refresh loads; a typed number is kept within the field's range.
  for (const id of ['maxBuilds', 'maxProMatches']) {
    const input = $('#' + id);
    input.value = cfg[id];
    input.onchange = () => {
      const n = Math.round(Number(input.value));
      const v = input.value !== '' && Number.isFinite(n) ? Math.min(+input.max, Math.max(+input.min, n)) : cfg[id];
      input.value = v;
      cfg[id] = v;
      save();
    };
  }
  bindSeg('source', 'defaultSource');
  bindSeg('position', 'position');
  bindSeg('pvMode', null, reloadPreview);

  const infernus = heroes.find((h) => h.name === 'Infernus');
  pvHeroId = infernus ? infernus.id : (heroes[0] ? heroes[0].id : '');
  pinHeroId = pvHeroId;
  const pvPicker = heroSelect($('#pvHero'), { value: pvHeroId, allowNone: false, alignRight: true, onChange: (id) => { pvHeroId = id; reloadPreview(); } });
  heroSelect($('#pinHero'), { value: pinHeroId, onChange: (id) => { pinHeroId = id; } });
  $('#pinAdd').onclick = () => {
    const id = parseInt($('#pinId').value, 10);
    if (!id || !pinHeroId) return;
    cfg.pinnedBuilds = { ...(cfg.pinnedBuilds || {}), [pinHeroId]: id };
    $('#pinId').value = '';
    renderPins(); save();
  };
  renderPins();

  document.querySelectorAll('[data-run]').forEach((b) => b.onclick = async () => {
    const all = document.querySelectorAll('[data-run]');
    all.forEach((x) => x.disabled = true);
    log(`> ${b.textContent.trim()}`);
    refreshStatus();
    try {
      const r = await api('/api/run/' + b.dataset.run, {});
      (r.log || '').trim().split('\n').slice(-40).forEach((l) => l && log(l));
      log(r.ok ? 'done' : 'failed', r.ok ? 'ok' : 'err');
      if (b.dataset.run === 'gen') {
        heroes = await api('/api/heroes');
        RANKS = await api('/api/ranks');
        pvPicker.refresh();
        paintRank('minBadgeWinrate'); paintRank('proBadge');
      }
      reloadPreview();
    } finally {
      all.forEach((x) => x.disabled = false);
      refreshStatus();
    }
  });

  window.addEventListener('message', async (e) => {
    if (!e.data) return;
    if (e.data.type === 'bb-log') log(e.data.text);
    // A pin changed in the preview bubble: save it like a pin added here (0 = unpinned). The config is
    // saved directly so the preview keeps its state instead of reloading.
    if (e.data.type === 'bb-pins') {
      const next = { ...(cfg.pinnedBuilds || {}) };
      for (const [heroId, buildId] of Object.entries(e.data.pins)) { if (buildId) next[heroId] = buildId; else delete next[heroId]; }
      cfg.pinnedBuilds = next;
      cfg = (await api('/api/config', cfg)).config;
      renderPins();
      log('Pinned builds saved. Refresh data, then Install, to use them in the game.');
    }
  });
  reloadPreview();
  refreshStatus();
}
init();
</script>
</body>
</html>
